<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">VERCODE Trust Model &amp; Security Boundaries</title><desc id="desc">Three trust domains connected by HMAC ingress and RBAC egress gates, with invariant cards for data-only handling, tenant isolation, and secret redaction.</desc>
