<text x="36" y="34" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10px" font-weight="800" fill="#64748B" text-anchor="start" letter-spacing="1.8px">SYSTEM DESIGN / VERCODE</text><text x="36" y="70" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="29px" font-weight="750" fill="#0F172A" text-anchor="start" letter-spacing="-0.65px">VERCODE — Trust Model &amp; Security Boundaries</text><text x="37" y="98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14px" font-weight="450" fill="#64748B" text-anchor="start" >CORE INVARIANT: repository content is treated strictly as input, never as authority</text><path d="M 36 112 H 1564" fill="none" stroke="grey" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/><rect x="30" y="130" width="410" height="410" rx="16" fill="#FFF8F8" stroke="#DDE5EF" stroke-width="1.1" filter="url(#softShadow)"/><rect x="30" y="130" width="410" height="6" rx="16" fill="#EF4444" /><rect x="30" y="134" width="410" height="3" rx="0" fill="#EF4444" /><text x="48" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14.8px" font-weight="850" fill="#EF4444" text-anchor="start" letter-spacing="0.35px">1. UNTRUSTED DOMAIN</text><text x="425" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.2px" font-weight="600" fill="#EF4444" text-anchor="end" >External &amp; Adversarial</text><rect x="500" y="130" width="565" height="410" rx="16" fill="#F8FBFF" stroke="#DDE5EF" stroke-width="1.1" filter="url(#softShadow)"/><rect x="500" y="130" width="565" height="6" rx="16" fill="#2563EB" /><rect x="500" y="134" width="565" height="3" rx="0" fill="#2563EB" /><text x="518" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14.8px" font-weight="850" fill="#2563EB" text-anchor="start" letter-spacing="0.35px">2. PLATFORM TRUSTED CORE</text><text x="1050" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.2px" font-weight="600" fill="#2563EB" text-anchor="end" >Zero-Trust Compute</text><rect x="1125" y="130" width="445" height="410" rx="16" fill="#F7FFF9" stroke="#DDE5EF" stroke-width="1.1" filter="url(#softShadow)"/><rect x="1125" y="130" width="445" height="6" rx="16" fill="#10B981" /><rect x="1125" y="134" width="445" height="3" rx="0" fill="#10B981" /><text x="1143" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14.8px" font-weight="850" fill="#10B981" text-anchor="start" letter-spacing="0.35px">3. EXECUTION SANDBOX</text><text x="1555" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.2px" font-weight="600" fill="#10B981" text-anchor="end" >Isolated &amp; Ephemeral</text><rect x="45" y="185" width="380" height="68" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" /><circle cx="63" cy="208" r="3" fill="#EF4444"/><text x="75" y="211" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.2px" font-weight="720" fill="#B91C1C" text-anchor="start" >PR Unified Diffs &amp; Code Content</text><text x="75" y="233" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Untrusted files · 1-hop AST imports</text><rect x="45" y="267" width="380" height="68" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" /><circle cx="63" cy="290" r="3" fill="#EF4444"/><text x="75" y="293" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.2px" font-weight="720" fill="#B91C1C" text-anchor="start" >PR Titles, Bodies &amp; Comments</text><text x="75" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Prompt injection surface · data only</text><rect x="45" y="349" width="380" height="68" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" /><circle cx="63" cy="372" r="3" fill="#EF4444"/><text x="75" y="375" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.2px" font-weight="720" fill="#B91C1C" text-anchor="start" >Incoming Webhook Deliveries</text><text x="75" y="397" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Third-party triggers · forge &amp; replay risks</text><rect x="45" y="431" width="380" height="68" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" /><circle cx="63" cy="454" r="3" fill="#EF4444"/><text x="75" y="457" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.2px" font-weight="720" fill="#B91C1C" text-anchor="start" >Raw AI Provider Completions</text><text x="75" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Untrusted until Zod + line-anchor checks</text><rect x="515" y="185" width="535" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><circle cx="533" cy="208" r="3" fill="#2563EB"/><text x="545" y="211" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.4px" font-weight="720" fill="#1D4ED8" text-anchor="start" >Fastify API Ingress Gateway</text><text x="545" y="233" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >HMAC verify · 5-min window · dedup &lt;300 ms · zero LLM</text><rect x="515" y="267" width="535" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><circle cx="533" cy="290" r="3" fill="#2563EB"/><text x="545" y="293" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.4px" font-weight="720" fill="#1D4ED8" text-anchor="start" >BullMQ Review Engine Worker</text><text x="545" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Deterministic-first · ESLint/Semgrep · schema-guarded AI</text><rect x="515" y="349" width="535" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><circle cx="533" cy="372" r="3" fill="#2563EB"/><text x="545" y="375" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.4px" font-weight="720" fill="#1D4ED8" text-anchor="start" >Managed State (PostgreSQL 16 &amp; Redis 7)</text><text x="545" y="397" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >Persist-then-publish · session revocation · DLQ</text><rect x="515" y="431" width="535" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" /><circle cx="533" cy="454" r="3" fill="#2563EB"/><text x="545" y="457" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.4px" font-weight="720" fill="#1D4ED8" text-anchor="start" >Cloud Key Management (KMS)</text><text x="545" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.8px" font-weight="450" fill="#1E293B" text-anchor="start" >App private key wrapped · BYOK AES-256-GCM ciphertexts</text><rect x="1140" y="185" width="415" height="68" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" /><circle cx="1158" cy="208" r="3" fill="#10B981"/><text x="1170" y="211" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.8px" font-weight="720" fill="#047857" text-anchor="start" >Static Analysis Process Isolation</text><text x="1170" y="233" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >ESLint / Semgrep runners with CPU &amp; memory caps</text><rect x="1140" y="267" width="415" height="68" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" /><circle cx="1158" cy="290" r="3" fill="#10B981"/><text x="1170" y="293" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.8px" font-weight="720" fill="#047857" text-anchor="start" >Ephemeral PR Test Sandbox (Phase 2)</text><text x="1170" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >gVisor / Firecracker microVM · untrusted code</text><rect x="1140" y="349" width="415" height="68" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" /><circle cx="1158" cy="372" r="3" fill="#10B981"/><text x="1170" y="375" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.8px" font-weight="720" fill="#047857" text-anchor="start" >AI Provider Boundaries</text><text x="1170" y="397" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Zero data-retention headers · no model training</text><rect x="1140" y="431" width="415" height="68" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" /><circle cx="1158" cy="454" r="3" fill="#10B981"/><text x="1170" y="457" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12.8px" font-weight="720" fill="#047857" text-anchor="start" >GitHub API Publication Egress</text><text x="1170" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Short-lived installation tokens · pull_requests:write</text><path d="M 440 326 H 500" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)" opacity="1"/><rect x="455" y="285" width="31" height="82" rx="8" fill="#FFFFFF" stroke="#F87171" stroke-width="1.2" filter="url(#softShadow)"/><text x="470.5" y="303" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13px" font-weight="850" fill="#B91C1C" text-anchor="middle"><tspan x="470.5" dy="0">H</tspan><tspan x="470.5" dy="15">M</tspan><tspan x="470.5" dy="15">A</tspan><tspan x="470.5" dy="15">C</tspan></text><path d="M 1065 326 H 1125" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" opacity="1"/><rect x="1080" y="285" width="31" height="82" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" filter="url(#softShadow)"/><text x="1095.5" y="303" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13px" font-weight="850" fill="#047857" text-anchor="middle"><tspan x="1095.5" dy="0">R</tspan><tspan x="1095.5" dy="15">B</tspan><tspan x="1095.5" dy="15">A</tspan><tspan x="1095.5" dy="15">C</tspan></text><text x="470" y="384" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="8.2px" font-weight="800" fill="#B91C1C" text-anchor="middle" letter-spacing="0.8px">INGRESS</text><text x="1096" y="384" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="8.2px" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="0.8px">EGRESS</text><rect x="30" y="565" width="490" height="165" rx="13" fill="#FFFFFF" stroke="#DDE5EF" stroke-width="1.1" filter="url(#shadow)"/><rect x="30" y="565" width="490" height="5" rx="13" fill="#EF4444" /><rect x="30" y="569" width="490" height="3" rx="0" fill="#EF4444" /><text x="46" y="595" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.2px" font-weight="850" fill="#EF4444" text-anchor="start" letter-spacing="0.5px">INVARIANT 1: DATA ONLY</text><text x="46" y="620" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.1px" font-weight="760" fill="#0F172A" text-anchor="start" >Repository content is input, never authority.</text><circle cx="49" cy="644" r="2.2" fill="#EF4444"/><text x="59" y="648" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Prompt injection cannot change pipeline control flow</text><circle cx="49" cy="666" r="2.2" fill="#EF4444"/><text x="59" y="670" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >LLM output must satisfy Zod contracts</text><circle cx="49" cy="688" r="2.2" fill="#EF4444"/><text x="59" y="692" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Invalid diff anchors are dropped or demoted</text><rect x="555" y="565" width="490" height="165" rx="13" fill="#FFFFFF" stroke="#DDE5EF" stroke-width="1.1" filter="url(#shadow)"/><rect x="555" y="565" width="490" height="5" rx="13" fill="#2563EB" /><rect x="555" y="569" width="490" height="3" rx="0" fill="#2563EB" /><text x="571" y="595" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.2px" font-weight="850" fill="#2563EB" text-anchor="start" letter-spacing="0.5px">INVARIANT 2: ISOLATION</text><text x="571" y="620" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.1px" font-weight="760" fill="#0F172A" text-anchor="start" >Multi-tenant isolation by construction.</text><circle cx="574" cy="644" r="2.2" fill="#2563EB"/><text x="584" y="648" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >org_id leading index on every tenant table</text><circle cx="574" cy="666" r="2.2" fill="#2563EB"/><text x="584" y="670" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Cross-tenant queries return 404, not 403</text><circle cx="574" cy="688" r="2.2" fill="#2563EB"/><text x="584" y="692" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Redis keys scoped by org:repo:id</text><rect x="1080" y="565" width="490" height="165" rx="13" fill="#FFFFFF" stroke="#DDE5EF" stroke-width="1.1" filter="url(#shadow)"/><rect x="1080" y="565" width="490" height="5" rx="13" fill="#10B981" /><rect x="1080" y="569" width="490" height="3" rx="0" fill="#10B981" /><text x="1096" y="595" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="11.2px" font-weight="850" fill="#10B981" text-anchor="start" letter-spacing="0.5px">INVARIANT 3: REDACTION</text><text x="1096" y="620" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13.1px" font-weight="760" fill="#0F172A" text-anchor="start" >Zero secrets stored or logged in plaintext.</text><circle cx="1099" cy="644" r="2.2" fill="#10B981"/><text x="1109" y="648" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >GitHub App key wrapped by Cloud KMS</text><circle cx="1099" cy="666" r="2.2" fill="#10B981"/><text x="1109" y="670" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >BYOK keys encrypted with AES-256-GCM</text><circle cx="1099" cy="688" r="2.2" fill="#10B981"/><text x="1109" y="692" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="10.6px" font-weight="450" fill="#1E293B" text-anchor="start" >Pre-commit + runtime log-redaction gates</text><text x="1568" y="748" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="9.4px" font-weight="700" fill="#94A3B8" text-anchor="end" letter-spacing="1.1px">VERCODE  /  TRUST MODEL  /  v1</text></svg>