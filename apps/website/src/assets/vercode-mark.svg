<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none">
  <!--
    VERCODE brand mark (the product mark of the DESIGN_SYSTEM.md §4 token set).
    An angular "V" check inside a rounded-square outline, 1.5px stroke.

    Served from public/ so the header <img>, the favicon, and the build-time
    OG image (WFR-404's VERCODE-default 1200×630) all reuse one asset.
    As a standalone document (loaded via <img>), currentColor would fall
    back to black, so both themes are baked in with a prefers-color-scheme
    media query instead (light: graphite frame + emerald check; dark: ivory
    frame + bright emerald).
  -->
  <style>
    .frame { stroke: #1c1917; }
    .check { stroke: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #f4f2ef; }
      .check { stroke: #2dd4bf; }
    }
  </style>
  <rect class="frame" x="1.5" y="1.5" width="17" height="17" rx="4" stroke-width="1.5" />
  <path class="check" d="M5.5 7 10 14l4.5-7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
