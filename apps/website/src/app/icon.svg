<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="32" height="32" fill="none">
  <!--
    The Vercode favicon (apps/website's src/app/icon.svg, served by Next at
    /icon.svg). The brand mark — an angular "V" check inside a
    rounded-square outline — shared with public/vercode-mark.svg, so the
    OG image build task can reuse one asset. Both themes are baked in
    (a standalone SVG can't inherit the page's CSS custom properties).
  -->
  <style>
    .frame { stroke: #1c1917; }
    .check { stroke: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #f4f2ef; }
      .check { stroke: #2dd4bf; }
    }
  </style>
  <rect class="frame" x="1.5" y="1.5" width="17" height="17" rx="4" stroke-width="1.5" />
  <path class="check" d="M5.5 7 10 14l4.5-7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
