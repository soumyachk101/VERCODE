<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="VERCODE deployment topology">
  <defs>
    <marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#848fa8"/>
    </marker>
  </defs>

  <text x="40" y="34" fill="#e6e9f2" font-size="14" font-weight="700">Dev — docker compose (no external credentials)</text>
  <g font-size="12">
    <rect x="40" y="54" width="120" height="44" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="56" y="81" fill="#e6e9f2">postgres:16</text>
    <rect x="180" y="54" width="120" height="44" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="196" y="81" fill="#e6e9f2">redis:7</text>
    <rect x="320" y="54" width="100" height="44" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="336" y="81" fill="#e6e9f2">web</text>
    <rect x="440" y="54" width="100" height="44" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="456" y="81" fill="#e6e9f2">api</text>
    <rect x="560" y="54" width="100" height="44" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="576" y="81" fill="#e6e9f2">worker</text>
    <rect x="680" y="54" width="140" height="44" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="696" y="76" fill="#848fa8">mock-github</text>
    <text x="696" y="91" fill="#848fa8">mock-ai · mock-billing</text>
  </g>

  <line x1="40" y1="140" x2="820" y2="140" stroke="#2e3b5c"/>

  <text x="40" y="184" fill="#e6e9f2" font-size="14" font-weight="700">Production</text>
  <g font-size="12">
    <rect x="40" y="204" width="170" height="60" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="56" y="229" fill="#e6e9f2" font-weight="700">Managed Postgres</text>
    <text x="56" y="248" fill="#848fa8">PITR + read replica</text>

    <rect x="40" y="284" width="170" height="60" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="56" y="309" fill="#e6e9f2" font-weight="700">Managed Redis</text>
    <text x="56" y="328" fill="#848fa8">sessions · queues · cache</text>

    <rect x="320" y="204" width="480" height="60" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="336" y="229" fill="#e6e9f2" font-weight="700">Kubernetes / ECS — three stateless containers</text>
    <text x="336" y="248" fill="#848fa8">web + api scale on CPU/RPS · worker autoscales on review-queue depth (KEDA)</text>

    <rect x="320" y="284" width="480" height="60" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="336" y="309" fill="#e6e9f2" font-weight="700">Secrets + observability</text>
    <text x="336" y="328" fill="#848fa8">platform secret store · KMS-wrapped BYOK master key · Sentry + OpenTelemetry</text>
  </g>

  <line x1="230" y1="234" x2="320" y2="234" stroke="#848fa8" marker-end="url(#darr)"/>
  <line x1="230" y1="314" x2="320" y2="314" stroke="#848fa8" marker-end="url(#darr)"/>
</svg>
