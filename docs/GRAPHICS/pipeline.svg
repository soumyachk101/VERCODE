<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,monospace" role="img" aria-label="VERCODE review pipeline">
  <defs>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#848fa8"/>
    </marker>
  </defs>

  <g font-size="13" fill="#e6e9f2">
    <rect x="10" y="30" width="140" height="70" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="25" y="58" font-weight="700">Fetch</text>
    <text x="25" y="80" fill="#848fa8" font-size="11">diff + 1-hop context</text>

    <rect x="185" y="30" width="150" height="70" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="200" y="58" font-weight="700">Classify</text>
    <text x="200" y="80" fill="#848fa8" font-size="11">language + risk tier</text>

    <rect x="370" y="30" width="160" height="70" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="385" y="58" font-weight="700">Static analysis</text>
    <text x="385" y="80" fill="#848fa8" font-size="11">ESLint + Semgrep</text>

    <rect x="565" y="30" width="160" height="70" rx="8" fill="#1a1d29" stroke="#2e3b5c"/>
    <text x="580" y="58" font-weight="700">AI review</text>
    <text x="580" y="80" fill="#848fa8" font-size="11">triage → deep → security</text>

    <rect x="760" y="30" width="150" height="70" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="775" y="58" font-weight="700">Merge + validate</text>
    <text x="775" y="80" fill="#848fa8" font-size="11">line check · enums · Zod</text>

    <rect x="945" y="30" width="145" height="70" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="960" y="58" font-weight="700">Policy + dedup</text>
    <text x="960" y="80" fill="#848fa8" font-size="11">confidence floor 0.6</text>

    <rect x="1120" y="30" width="70" height="70" rx="8" fill="#16213e" stroke="#2e3b5c"/>
    <text x="1131" y="58" font-weight="700">Publish</text>
    <text x="1124" y="80" fill="#848fa8" font-size="10">GitHub</text>
  </g>

  <line x1="150" y1="65" x2="185" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>
  <line x1="335" y1="65" x2="370" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>
  <line x1="530" y1="65" x2="565" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>
  <line x1="725" y1="65" x2="760" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>
  <line x1="910" y1="65" x2="945" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>
  <line x1="1095" y1="65" x2="1120" y2="65" stroke="#848fa8" marker-end="url(#parr)"/>

  <text x="370" y="20" fill="#5d6b8c" font-size="11">deterministic</text>
  <text x="580" y="20" fill="#5d6b8c" font-size="11">AI (bounded context, schema-validated)</text>
</svg>
