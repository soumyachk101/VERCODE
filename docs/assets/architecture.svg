<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VERCODE architecture diagram">
  <defs>
    <style>
      .label { font-family: 'SF Pro Display', 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1a2b3c; }
      .sub { font-family: 'SF Pro Text', 'Segoe UI', -apple-system, sans-serif; font-size: 10px; fill: #5a6b7c; }
      .box-title { font-family: 'SF Pro Display', 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; }
      .arrow { stroke-width: 1.8; fill: none; }
      .flow-label { font-family: 'SF Pro Text', 'Segoe UI', -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #4a5a6a; }
    </style>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3a9d5c"/></marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8faff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" class="box-title" fill="#1a2b3c" style="font-size:22px">VERCODE — System Architecture</text>
  <text x="600" y="56" text-anchor="middle" class="sub">Three trust domains · two ingress points · no LLM on the webhook path</text>

  <!-- Trust domain labels -->
  <rect x="20" y="76" width="370" height="700" rx="10" fill="#fef2f2" opacity="0.5" stroke="#fecaca" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="35" y="98" class="sub" fill="#991b1b" style="font-size:11px;font-weight:700">UNTRUSTED DOMAIN</text>

  <rect x="410" y="76" width="380" height="700" rx="10" fill="#eff6ff" opacity="0.5" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="425" y="98" class="sub" fill="#1e40af" style="font-size:11px;font-weight:700">PLATFORM (TRUSTED CORE)</text>

  <rect x="810" y="76" width="370" height="700" rx="10" fill="#f0fdf4" opacity="0.5" stroke="#bbf7d0" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="825" y="98" class="sub" fill="#166534" style="font-size:11px;font-weight:700">EXTERNAL SERVICES</text>

  <!-- ========== UNTRUSTED COLUMN ========== -->

  <!-- GitHub App -->
  <rect x="40" y="120" width="330" height="100" rx="10" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="148" text-anchor="middle" class="box-title" fill="#1a2b3c">GitHub App</text>
  <text x="205" y="168" text-anchor="middle" class="sub">App JWT → Installation Tokens</text>
  <text x="205" y="183" text-anchor="middle" class="sub">HMAC-SHA256 Signed Webhooks</text>
  <text x="205" y="198" text-anchor="middle" class="sub">5-min window · 24h delivery-id dedup</text>

  <!-- PR Content -->
  <rect x="40" y="240" width="330" height="80" rx="10" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="268" text-anchor="middle" class="box-title" fill="#1a2b3c">PR Content</text>
  <text x="205" y="288" text-anchor="middle" class="sub">Diff · files · body · comments · title</text>
  <text x="205" y="303" text-anchor="middle" class="sub">Treated as untrusted data in the pipeline</text>

  <!-- AI Provider Output -->
  <rect x="40" y="340" width="330" height="80" rx="10" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="368" text-anchor="middle" class="box-title" fill="#1a2b3c">AI Provider Output</text>
  <text x="205" y="388" text-anchor="middle" class="sub">Structured findings (Zod-validated)</text>
  <text x="205" y="403" text-anchor="middle" class="sub">No tool-calling path exists in review mode</text>

  <!-- Billing Provider -->
  <rect x="40" y="440" width="330" height="80" rx="10" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="468" text-anchor="middle" class="box-title" fill="#1a2b3c">Billing Provider</text>
  <text x="205" y="488" text-anchor="middle" class="sub">Stripe / Razorpay Webhooks</text>
  <text x="205" y="503" text-anchor="middle" class="sub">Signature-checked · event-id idempotent</text>

  <!-- Webhook Ingress path labels -->
  <text x="45" y="548" class="sub" fill="#991b1b" style="font-size:10px">▲ Ingress — two machine paths + one human path</text>

  <!-- ========== PLATFORM COLUMN ========== -->

  <!-- Browser / Dashboard -->
  <rect x="430" y="120" width="340" height="80" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" class="box-title" fill="#2563eb">Browser — Dashboard</text>
  <text x="600" y="168" text-anchor="middle" class="sub">Next.js 15 · App Router · Tailwind 4 · shadcn/ui</text>
  <text x="600" y="183" text-anchor="middle" class="sub">Session cookie (HttpOnly, Secure, SameSite=Lax)</text>

  <!-- Fastify API -->
  <rect x="430" y="230" width="340" height="130" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="258" text-anchor="middle" class="box-title" fill="#2563eb">Fastify API</text>
  <text x="600" y="278" text-anchor="middle" class="sub">• Auth (Argon2id + Redis sessions)</text>
  <text x="600" y="293" text-anchor="middle" class="sub">• Dashboard REST (tenant-scoped)</text>
  <text x="600" y="308" text-anchor="middle" class="sub">• Webhook ingress (GitHub + Billing)</text>
  <text x="600" y="323" text-anchor="middle" class="sub">• Rate limits · Health endpoints</text>
  <rect x="445" y="336" width="310" height="18" rx="4" fill="#fef3c7" opacity="0.7"/>
  <text x="600" y="349" text-anchor="middle" class="sub" fill="#92400e" style="font-weight:700">Never runs the review pipeline</text>

  <!-- Queue -->
  <rect x="430" y="388" width="340" height="70" rx="10" fill="white" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="416" text-anchor="middle" class="box-title" fill="#ea580c">BullMQ Queue (Redis 7)</text>
  <text x="600" y="436" text-anchor="middle" class="sub">review-queue · durable · DLQ · backpressure</text>
  <text x="600" y="451" text-anchor="middle" class="sub">KEDA autoscale trigger on queue lag</text>

  <!-- Worker -->
  <rect x="430" y="485" width="340" height="150" rx="10" fill="white" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="513" text-anchor="middle" class="box-title" fill="#ea580c">BullMQ Worker</text>
  <text x="600" y="533" text-anchor="middle" class="sub">dequeue → fetch diff → static analysis → AI review</text>
  <text x="600" y="548" text-anchor="middle" class="sub">→ validate → dedup → policy → summary → publish</text>
  <rect x="445" y="562" width="310" height="60" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="600" y="580" text-anchor="middle" class="sub" fill="#9a3412">Pipeline stages:</text>
  <text x="600" y="595" text-anchor="middle" class="sub" fill="#9a3412">classify → ESLint + Semgrep → OpenAI (task-routed)</text>
  <text x="600" y="610" text-anchor="middle" class="sub" fill="#9a3412">→ Zod validate → dedup → confidence floor → summary</text>

  <!-- Data store row -->
  <rect x="430" y="660" width="160" height="90" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="510" y="688" text-anchor="middle" class="box-title" fill="#7c3aed">PostgreSQL 16</text>
  <text x="510" y="708" text-anchor="middle" class="sub">reviews · findings · orgs</text>
  <text x="510" y="723" text-anchor="middle" class="sub">usage · audit · billing</text>
  <text x="510" y="738" text-anchor="middle" class="sub" fill="#7c3aed" style="font-weight:700">Single source of truth</text>

  <rect x="610" y="660" width="160" height="90" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="690" y="688" text-anchor="middle" class="box-title" fill="#7c3aed">Redis 7</text>
  <text x="690" y="708" text-anchor="middle" class="sub">sessions · queues · diff cache</text>
  <text x="690" y="723" text-anchor="middle" class="sub">org-scoped · 24h TTL diff cache</text>
  <text x="690" y="738" text-anchor="middle" class="sub" fill="#7c3aed" style="font-weight:700">Ephemeral by design</text>

  <!-- ========== EXTERNAL COLUMN ========== -->

  <!-- GitHub REST -->
  <rect x="830" y="120" width="330" height="80" rx="10" fill="white" stroke="#166534" stroke-width="1.5"/>
  <text x="995" y="148" text-anchor="middle" class="box-title" fill="#166534">GitHub REST API</text>
  <text x="995" y="168" text-anchor="middle" class="sub">Fetch diff + bounded context</text>
  <text x="995" y="183" text-anchor="middle" class="sub">Publish review + inline comments</text>

  <!-- AI Provider -->
  <rect x="830" y="230" width="330" height="80" rx="10" fill="white" stroke="#166534" stroke-width="1.5"/>
  <text x="995" y="258" text-anchor="middle" class="box-title" fill="#166534">AI Provider</text>
  <text x="995" y="278" text-anchor="middle" class="sub">OpenAI · Anthropic · Ollama</text>
  <text x="995" y="293" text-anchor="middle" class="sub">Task-routed · token-budgeted</text>
  <text x="995" y="308" text-anchor="middle" class="sub">No-training endpoint (NFR-29)</text>

  <!-- Static Analysis -->
  <rect x="830" y="340" width="330" height="80" rx="10" fill="white" stroke="#166534" stroke-width="1.5"/>
  <text x="995" y="368" text-anchor="middle" class="box-title" fill="#166534">Static Analysis</text>
  <text x="995" y="388" text-anchor="middle" class="sub">ESLint + Semgrep (deterministic)</text>
  <text x="995" y="403" text-anchor="middle" class="sub">Runs as worker sub-process in MVP</text>
  <text x="995" y="418" text-anchor="middle" class="sub" fill="#166534" style="font-weight:700">No production credentials</text>

  <!-- Observability -->
  <rect x="830" y="450" width="330" height="80" rx="10" fill="white" stroke="#0d9488" stroke-width="1.5"/>
  <text x="995" y="478" text-anchor="middle" class="box-title" fill="#0d9488">Observability</text>
  <text x="995" y="498" text-anchor="middle" class="sub">Sentry · OpenTelemetry · pino</text>
  <text x="995" y="513" text-anchor="middle" class="sub">Correlation id end-to-end</text>

  <!-- KMS -->
  <rect x="830" y="560" width="330" height="70" rx="10" fill="white" stroke="#0d9488" stroke-width="1.5"/>
  <text x="995" y="588" text-anchor="middle" class="box-title" fill="#0d9488">KMS + Secret Store</text>
  <text x="995" y="608" text-anchor="middle" class="sub">App private key · BYOK master key · signing key</text>
  <text x="995" y="623" text-anchor="middle" class="sub">AES-256-GCM wrapped · never in a DB column</text>

  <!-- ========== ARROWS ========== -->

  <!-- Browser → API -->
  <line x1="600" y1="200" x2="600" y2="228" class="arrow" stroke="#2563eb" marker-end="url(#arrB)"/>
  <text x="612" y="218" class="flow-label" fill="#2563eb">REST + session cookie</text>

  <!-- API → Queue -->
  <line x1="600" y1="360" x2="600" y2="386" class="arrow" stroke="#ea580c" marker-end="url(#arrO)"/>
  <text x="612" y="376" class="flow-label" fill="#ea580c">verify + enqueue</text>

  <!-- Queue → Worker -->
  <line x1="600" y1="458" x2="600" y2="483" class="arrow" stroke="#ea580c" marker-end="url(#arrO)"/>
  <text x="612" y="474" class="flow-label" fill="#ea580c">dequeue</text>

  <!-- Worker → PG -->
  <line x1="530" y1="635" x2="510" y2="658" class="arrow" stroke="#7c3aed" marker-end="url(#arrP)"/>
  <text x="472" y="650" class="flow-label" fill="#7c3aed">persist</text>

  <!-- Worker → Redis -->
  <line x1="670" y1="635" x2="690" y2="658" class="arrow" stroke="#7c3aed" marker-end="url(#arrP)"/>
  <text x="695" y="650" class="flow-label" fill="#7c3aed">cache / state</text>

  <!-- GitHub webhook → API -->
  <path d="M 370 160 C 400 160, 400 260, 428 260" class="arrow" stroke="#dc2626" marker-end="url(#arrR)"/>
  <text x="405" y="152" text-anchor="middle" class="flow-label" fill="#dc2626">signed webhook</text>

  <!-- API → GitHub REST -->
  <path d="M 770 265 C 800 265, 800 160, 828 160" class="arrow" stroke="#166534" marker-end="url(#arrG)"/>
  <text x="800" y="205" text-anchor="middle" class="flow-label" fill="#166534">diff fetch / publish</text>

  <!-- Worker → AI Provider -->
  <path d="M 770 525 C 800 525, 800 262, 828 262" class="arrow" stroke="#166534" marker-end="url(#arrG)"/>
  <text x="800" y="400" text-anchor="middle" class="flow-label" fill="#166534">structured call</text>

  <!-- Worker → Static Analysis -->
  <path d="M 770 560 C 800 560, 800 378, 828 378" class="arrow" stroke="#166534" marker-end="url(#arrG)"/>
  <text x="800" y="468" text-anchor="middle" class="flow-label" fill="#166534">deterministic findings</text>

  <!-- Observability → Worker -->
  <path d="M 830 485 C 800 485, 800 545, 772 545" class="arrow" stroke="#0d9488" marker-end="url(#arrT)"/>
  <text x="800" y="530" text-anchor="middle" class="flow-label" fill="#0d9488">correlation ids</text>

  <!-- Billing webhook → API -->
  <path d="M 370 480 C 400 480, 400 330, 428 330" class="arrow" stroke="#dc2626" marker-end="url(#arrR)"/>
  <text x="405" y="455" text-anchor="middle" class="flow-label" fill="#dc2626">billing webhook</text>

  <!-- KMS → API -->
  <path d="M 830 590 C 800 590, 800 320, 772 320" class="arrow" stroke="#0d9488" marker-end="url(#arrT)"/>
  <text x="800" y="565" text-anchor="middle" class="flow-label" fill="#0d9488">decrypt BYOK</text>

  <!-- Legend -->
  <line x1="30" y1="808" x2="50" y2="808" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="54" y="812" class="sub">Ingress (untrusted → trusted)</text>
  <line x1="190" y1="808" x2="210" y2="808" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="214" y="812" class="sub">Browser → API</text>
  <line x1="290" y1="808" x2="310" y2="808" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="314" y="812" class="sub">Queue → Worker</text>
  <line x1="400" y1="808" x2="420" y2="808" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="424" y="812" class="sub">Data persist</text>
  <line x1="500" y1="808" x2="520" y2="808" stroke="#166534" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="524" y="812" class="sub">External call</text>
  <line x1="620" y1="808" x2="640" y2="808" stroke="#0d9488" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="644" y="812" class="sub">Observability / KMS</text>
</svg>
