  <text x="304" y="626" class="card-title">Summary</text>
  <text x="304" y="654" class="cell">Two high-severity issues stand out: a query built directly from the request body, and a</text>
  <text x="304" y="674" class="cell">retry path that dereferences a possibly-null response. Both are localized and the</text>
  <text x="304" y="694" class="cell">suggested fixes are small; the rest of the diff is clean. Recommend changes before merge.</text>
