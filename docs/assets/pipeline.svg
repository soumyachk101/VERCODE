<svg viewBox="0 0 1380 580" width="1380" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VERCODE review pipeline architecture">
  <defs>
    <style>
      .p-main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; letter-spacing: -0.5px; }
      .p-sub-title  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .col-header   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.8px; }
      .node-title   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .node-badge   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; }
      .node-text    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; line-height: 1.4; }
      .flow-label   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #334155; }
      .inv-title    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
      .inv-text     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#dc2626"/></marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#ea580c"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#16a34a"/></marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#7c3aed"/></marker>
    <marker id="arrTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#0d9488"/></marker>

    <!-- Drop Shadow Filter -->
    <filter id="pDrop" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1380" height="580" fill="#f8fafc"/>

  <!-- Top Title -->
  <text x="690" y="36" text-anchor="middle" class="p-main-title">VERCODE — Review Engine Pipeline (Hot Path)</text>
  <text x="690" y="56" text-anchor="middle" class="p-sub-title">Deterministic-First Analysis · Schema-Enforced AI Reasoning · Transactional Persist-then-Publish</text>

  <!-- ========================================================================= -->
  <!-- 6 PIPELINE SWIMLANES                                                      -->
  <!-- ========================================================================= -->

  <!-- Lane 1: Ingress -->
  <rect x="30" y="78" width="195" height="360" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="42" y="90" width="171" height="22" rx="4" fill="#fee2e2"/>
  <text x="127" y="105" text-anchor="middle" class="col-header" fill="#991b1b">1. INGRESS &amp; VERIFY</text>

  <text x="46" y="136" class="node-title">GitHub Webhook</text>
  <rect x="46" y="144" width="105" height="18" rx="3" fill="#fef2f2"/>
  <text x="98" y="157" text-anchor="middle" class="node-badge" fill="#dc2626">HMAC-SHA256</text>

  <text x="46" y="180" class="node-text">• Route: POST /webhooks</text>
  <text x="46" y="196" class="node-text">• 5-minute timestamp window</text>
  <text x="46" y="212" class="node-text">• 24h delivery-id dedup</text>
  <text x="46" y="228" class="node-text">• Signature verification layer</text>
  <text x="46" y="244" class="node-text">• Body schema validation</text>

  <rect x="44" y="270" width="167" height="48" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="127" y="287" text-anchor="middle" class="node-badge" fill="#92400e">&lt; 300ms SLA</text>
  <text x="127" y="303" text-anchor="middle" class="node-text" fill="#92400e">Returns 202 Accepted</text>

  <rect x="44" y="330" width="167" height="92" rx="6" fill="#f1f5f9"/>
  <text x="127" y="348" text-anchor="middle" class="node-badge" fill="#334155">INGRESS INVARIANT</text>
  <text x="52" y="366" class="node-text">• Zero LLM calls on ingress</text>
  <text x="52" y="382" class="node-text">• Zero diff fetches on ingress</text>
  <text x="52" y="398" class="node-text">• T-10 DoS vector closed</text>


  <!-- Lane 2: Dispatch & Gates -->
  <rect x="255" y="78" width="195" height="360" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="267" y="90" width="171" height="22" rx="4" fill="#ffedd5"/>
  <text x="352" y="105" text-anchor="middle" class="col-header" fill="#9a3412">2. DISPATCH &amp; GATES</text>

  <text x="271" y="136" class="node-title">BullMQ review-queue</text>
  <rect x="271" y="144" width="100" height="18" rx="3" fill="#fff7ed"/>
  <text x="321" y="157" text-anchor="middle" class="node-badge" fill="#ea580c">DURABLE QUEUE</text>

  <text x="271" y="180" class="node-text">• Payload: { jobId } pointer</text>
  <text x="271" y="196" class="node-text">• Re-reads DB durable state</text>
  <text x="271" y="212" class="node-text">• In-flight lock (SET NX)</text>
  <text x="271" y="228" class="node-text">• Concurrency cap: 4 per worker</text>

  <rect x="269" y="250" width="167" height="82" rx="6" fill="#fffaf5" stroke="#fed7aa" stroke-width="1"/>
  <text x="352" y="268" text-anchor="middle" class="node-badge" fill="#c2410c">PRE-FLIGHT GATES</text>
  <text x="277" y="286" class="node-text">• Same-SHA check (ADR-007)</text>
  <text x="277" y="302" class="node-text">• Monthly plan quota check</text>
  <text x="277" y="318" class="node-text">• Over-cap: skip with notice</text>

  <rect x="269" y="344" width="167" height="78" rx="6" fill="#f1f5f9"/>
  <text x="352" y="362" text-anchor="middle" class="node-badge" fill="#334155">QUOTA GUARANTEE</text>
  <text x="277" y="380" class="node-text">If quota exceeded: ZERO AI</text>
  <text x="277" y="396" class="node-text">tokens consumed. Post notice</text>
  <text x="277" y="410" class="node-text">on PR; never silent skip.</text>


  <!-- Lane 3: Context Retrieval -->
  <rect x="480" y="78" width="195" height="360" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="492" y="90" width="171" height="22" rx="4" fill="#dbeafe"/>
  <text x="577" y="105" text-anchor="middle" class="col-header" fill="#1e40af">3. CONTEXT RETRIEVAL</text>

  <text x="496" y="136" class="node-title">Bounded Diff &amp; AST</text>
  <rect x="496" y="144" width="115" height="18" rx="3" fill="#eff6ff"/>
  <text x="553" y="157" text-anchor="middle" class="node-badge" fill="#2563eb">CONTEXT BOUND</text>

  <text x="496" y="180" class="node-text">• Fetch PR unified diff (GitHub)</text>
  <text x="496" y="196" class="node-text">• 24h TTL Redis diff cache</text>
  <text x="496" y="212" class="node-text">• Parse ChangeSet &amp; line map</text>
  <text x="496" y="228" class="node-text">• 1-hop AST import graph only</text>
  <text x="496" y="244" class="node-text">• File risk tier classification</text>

  <rect x="494" y="270" width="167" height="72" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="577" y="288" text-anchor="middle" class="node-badge" fill="#1e40af">BUDGET CAPS (NFR-19)</text>
  <text x="502" y="306" class="node-text">• Max 60 changed files</text>
  <text x="502" y="322" class="node-text">• Max 3,000 changed lines</text>

  <rect x="494" y="354" width="167" height="68" rx="6" fill="#f1f5f9"/>
  <text x="577" y="372" text-anchor="middle" class="node-badge" fill="#334155">PRIVACY INVARIANT</text>
  <text x="502" y="390" class="node-text">Never fetch full repository.</text>
  <text x="502" y="406" class="node-text">Diff slice + 1-hop AST only.</text>


  <!-- Lane 4: Dual Analysis (Static + AI) -->
  <rect x="705" y="78" width="225" height="360" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="717" y="90" width="201" height="22" rx="4" fill="#f3e8ff"/>
  <text x="817" y="105" text-anchor="middle" class="col-header" fill="#6b21a8">4. DUAL ANALYSIS ENGINE</text>

  <!-- Branch A: Static Analysis -->
  <rect x="717" y="122" width="201" height="110" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="729" y="142" class="node-title" fill="#7e22ce" style="font-size:12.5px">Branch A: Static Analysis</text>
  <rect x="729" y="149" width="115" height="16" rx="3" fill="#fae8ff"/>
  <text x="786" y="161" text-anchor="middle" class="node-badge" fill="#86198f">ESLINT + SEMGREP</text>
  <text x="729" y="180" class="node-text">• Deterministic security/AST rules</text>
  <text x="729" y="195" class="node-text">• Zero LLM token cost · Subprocess</text>
  <text x="729" y="210" class="node-text" fill="#86198f" style="font-weight:700">✓ Authoritative (Exempt from floor)</text>

  <!-- Branch B: Task-Routed AI -->
  <rect x="717" y="244" width="201" height="180" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="729" y="264" class="node-title" fill="#5b21b6" style="font-size:12.5px">Branch B: AI Review</text>
  <rect x="729" y="271" width="125" height="16" rx="3" fill="#ede9fe"/>
  <text x="791" y="283" text-anchor="middle" class="node-badge" fill="#5b21b6">TASK-ROUTED LLM</text>
  <text x="729" y="302" class="node-text">1. Risk Triage Pass (cheap model)</text>
  <text x="729" y="318" class="node-text">2. Deep Review Pass (strong model)</text>
  <text x="729" y="334" class="node-text">3. Security Audit Pass (high-risk)</text>
  <text x="729" y="350" class="node-text">• Bounded retries (exp backoff)</text>
  <text x="729" y="366" class="node-text">• Provider fallback on 429/5xx</text>
  <text x="729" y="382" class="node-text">• Zod schema constrained output</text>
  <text x="729" y="405" class="node-text" fill="#5b21b6" style="font-weight:700">✓ AI failure → partial job; static lives</text>


  <!-- Lane 5: Merge & Policy -->
  <rect x="960" y="78" width="195" height="360" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="972" y="90" width="171" height="22" rx="4" fill="#dcfce7"/>
  <text x="1057" y="105" text-anchor="middle" class="col-header" fill="#15803d">5. MERGE &amp; POLICY</text>

  <text x="976" y="136" class="node-title">Validate &amp; Dedup</text>
  <rect x="976" y="144" width="105" height="18" rx="3" fill="#f0fdf4"/>
  <text x="128" y="157" text-anchor="middle" class="node-badge" fill="#16a34a">GROUNDING</text>

  <text x="976" y="180" class="node-text">• Line-in-diff validation</text>
  <text x="976" y="196" class="node-text">• Anchor resolution (diff-engine)</text>
  <text x="976" y="212" class="node-text">• Dedup on (file, line, category)</text>
  <text x="976" y="228" class="node-text">• Static findings win priority</text>

  <rect x="974" y="250" width="167" height="90" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="1057" y="268" text-anchor="middle" class="node-badge" fill="#15803d">POLICY GATES (STAGE 11)</text>
  <text x="982" y="286" class="node-text">• Confidence floor (default 0.6)</text>
  <text x="982" y="302" class="node-text">• Org custom rules &amp; suppressions</text>
  <text x="982" y="318" class="node-text">• Dynamic severity categorization</text>
  <text x="982" y="332" class="node-text">• Structured summary synthesis</text>

  <rect x="974" y="352" width="167" height="70" rx="6" fill="#f1f5f9"/>
  <text x="1057" y="370" text-anchor="middle" class="node-badge" fill="#334155">FALLBACK GUARANTEE</text>
  <text x="982" y="388" class="node-text">If line anchor fails → demote</text>
  <text x="982" y="404" class="node-text">finding to PR summary body.</text>


  <!-- Lane 6: Persist & Publish -->
  <rect x="1185" y="78" width="165" height="360" rx="12" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5" filter="url(#pDrop)"/>
  <rect x="1197" y="90" width="141" height="22" rx="4" fill="#ccfbf1"/>
  <text x="1267" y="105" text-anchor="middle" class="col-header" fill="#0f766e">6. PERSIST &amp; PUBLISH</text>

  <text x="1197" y="136" class="node-title">Persist-then-Publish</text>
  <rect x="1197" y="144" width="110" height="18" rx="3" fill="#f0fdfa"/>
  <text x="1252" y="157" text-anchor="middle" class="node-badge" fill="#0d9488">ATOMIC TX FIRST</text>

  <text x="1197" y="180" class="node-text">Step 1: DB Transaction</text>
  <text x="1197" y="195" class="node-text">• Store ReviewFinding rows</text>
  <text x="1197" y="210" class="node-text">• Update ReviewJob status</text>
  <text x="1197" y="225" class="node-text">• Append UsageEvent row</text>
  <text x="1197" y="240" class="node-text">  (tokens, USD, model)</text>

  <line x1="1205" y1="254" x2="1335" y2="254" stroke="#e2e8f0" stroke-width="1"/>

  <text x="1197" y="274" class="node-text">Step 2: GitHub Publish</text>
  <text x="1197" y="290" class="node-text">• Post verdict summary</text>
  <text x="1197" y="306" class="node-text">• Post validated inline</text>
  <text x="1197" y="322" class="node-text">  review comments</text>
  <text x="1197" y="338" class="node-text">• Save publishedReviewId</text>

  <rect x="1195" y="354" width="145" height="68" rx="6" fill="#f1f5f9"/>
  <text x="1267" y="372" text-anchor="middle" class="node-badge" fill="#334155">INDEPENDENT RETRY</text>
  <text x="1202" y="390" class="node-text">GitHub 429 retries publish</text>
  <text x="1202" y="406" class="node-text">only — never re-runs AI.</text>


  <!-- ========================================================================= -->
  <!-- CONNECTORS & ARROWS                                                       -->
  <!-- ========================================================================= -->

  <!-- Lane 1 -> Lane 2 -->
  <line x1="225" y1="210" x2="251" y2="210" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <rect x="227" y="198" width="22" height="14" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="238" y="208" text-anchor="middle" class="flow-label" fill="#dc2626">job</text>

  <!-- Lane 2 -> Lane 3 -->
  <line x1="450" y1="210" x2="476" y2="210" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrOrange)"/>
  <rect x="452" y="198" width="22" height="14" rx="2" fill="#ffffff" stroke="#fed7aa" stroke-width="0.8"/>
  <text x="463" y="208" text-anchor="middle" class="flow-label" fill="#ea580c">run</text>

  <!-- Lane 3 -> Lane 4 (Split to Branch A and Branch B) -->
  <path d="M 675,190 H 690 V 165 H 713" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path d="M 675,230 H 690 V 320 H 713" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <rect x="677" y="200" width="26" height="20" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="690" y="213" text-anchor="middle" class="flow-label" fill="#2563eb">diff</text>

  <!-- Lane 4 -> Lane 5 (Merge from Branch A and Branch B) -->
  <path d="M 918,170 H 939 V 210 H 956" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrPurple)"/>
  <path d="M 918,330 H 939 V 230 H 956" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrPurple)"/>
  <rect x="927" y="210" width="28" height="20" rx="3" fill="#ffffff" stroke="#d8b4fe" stroke-width="0.8"/>
  <text x="941" y="223" text-anchor="middle" class="flow-label" fill="#7c3aed">merge</text>

  <!-- Lane 5 -> Lane 6 -->
  <line x1="1155" y1="220" x2="1181" y2="220" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <rect x="1156" y="208" width="26" height="14" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
  <text x="1169" y="218" text-anchor="middle" class="flow-label" fill="#16a34a">post</text>


  <!-- ========================================================================= -->
  <!-- BOTTOM GUARDRAILS (4 CLEAN PROPORTIONED CARDS)                           -->
  <!-- ========================================================================= -->
  <g filter="url(#pDrop)">
    <rect x="30" y="460" width="315" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="42" y="470" width="85" height="16" rx="3" fill="#fee2e2"/>
    <text x="84" y="482" text-anchor="middle" class="node-badge" fill="#991b1b">T-10 DEFENSE</text>
    <text x="42" y="504" class="inv-title">Constant Ingress Latency</text>
    <text x="42" y="522" class="inv-text">No LLM calls or git fetches on webhook ingress.</text>
    <text x="42" y="538" class="inv-text">Signature check + BullMQ enqueue completes &lt; 300ms.</text>
  </g>

  <g filter="url(#pDrop)">
    <rect x="375" y="460" width="315" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="387" y="470" width="95" height="16" rx="3" fill="#fef3c7"/>
    <text x="434" y="482" text-anchor="middle" class="node-badge" fill="#92400e">COST DISCIPLINE</text>
    <text x="387" y="504" class="inv-title">Hard Quota &amp; Idempotency</text>
    <text x="387" y="522" class="inv-text">Same commit SHA returns cached result immediately.</text>
    <text x="387" y="538" class="inv-text">Over-quota reviews skip with notice, consuming 0 tokens.</text>
  </g>

  <g filter="url(#pDrop)">
    <rect x="720" y="460" width="315" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="732" y="470" width="105" height="16" rx="3" fill="#ede9fe"/>
    <text x="784" y="482" text-anchor="middle" class="node-badge" fill="#5b21b6">GROUNDING GATE</text>
    <text x="732" y="504" class="inv-title">Line-in-Diff Validation</text>
    <text x="732" y="522" class="inv-text">AI findings without valid diff line anchors are demoted.</text>
    <text x="732" y="538" class="inv-text">Deterministic static findings always publish, even if AI down.</text>
  </g>

  <g filter="url(#pDrop)">
    <rect x="1065" y="460" width="285" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="1077" y="470" width="90" height="16" rx="3" fill="#ccfbf1"/>
    <text x="1122" y="482" text-anchor="middle" class="node-badge" fill="#0f766e">DATA INTEGRITY</text>
    <text x="1077" y="504" class="inv-title">Persist-then-Publish</text>
    <text x="1077" y="522" class="inv-text">PostgreSQL commits findings and usage before GitHub call.</text>
    <text x="1077" y="538" class="inv-text">GitHub 429 rate limit retries publish, not LLM execution.</text>
  </g>
</svg>
