# VERCODE — OpenAPI Specification

This is the *documented* OpenAPI 3.1 skeleton matching `API_SPECIFICATION.md` + `contracts`. The full generated file (`openapi.gen.yaml`, produced by the contracts package's codegen step and checked in) is the machine copy; this document is the reviewed source of intent. The CI gate: `contracts` codegen → `openapi.gen.yaml` → the Fastify routes are validated against it (a drift fails CI).

```yaml
openapi: 3.1.0
info:
  title: VERCODE API
  version: 1.0.0
  description: Dashboard + webhook API for the VERCODE AI code-review SaaS.
servers:
  - url: https://api.vercode.example/v1

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vercode_session

  schemas:
    FindingSeverity: { type: string, enum: [low, medium, high, critical] }
    FindingCategory:
      type: string
      enum: [logic-bug, security, performance, race-condition, resource-leak,
             api-contract, db-consistency, edge-case, assumption]
    ReviewFinding:
      type: object
      required: [id, file, line, severity, category, title, description, confidence]
      properties:
        id: { type: string }
        file: { type: string }
        line: { type: integer, minimum: 0 }
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        category: { $ref: "#/components/schemas/FindingCategory" }
        title: { type: string, minLength: 1 }
        description: { type: string }
        suggestedFix: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        promptVersion: { type: string }
    ReviewSummary:
      type: object
      required: [verdict, highSeverityCount, topRisks, overallConfidence]
      properties:
        verdict: { type: string }
        highSeverityCount: { type: integer, minimum: 0 }
        topRisks: { type: array, items: { type: string } }
        overallConfidence: { type: number, minimum: 0, maximum: 1 }
    ReviewJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, skipped, partial]
    ReviewJob:
      type: object
      required: [id, orgId, repoId, prNumber, commitSha, status, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        repoId: { type: string }
        prNumber: { type: integer, minimum: 1 }
        commitSha: { type: string }
        status: { $ref: "#/components/schemas/ReviewJobStatus" }
        skipReason: { type: string }
        estUsdCost: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    ReviewRequestPayload:
      type: object
      required: [orgId, repoId, prNumber, commitSha]
      properties:
        orgId: { type: string, minLength: 1 }
        repoId: { type: string, minLength: 1 }
        prNumber: { type: integer, minimum: 1 }
        commitSha: { type: string, minLength: 4 }
        confidenceFloor: { type: number, minimum: 0, maximum: 1 }
    FindingAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accepted, dismissed_reasonable, dismissed_unreasonable, fixed, ignored]
    Quota:
      type: object
      properties:
        used: { type: integer }
        limit: { type: integer }
        percentUsed: { type: number, minimum: 0, maximum: 100 }
    UsageSeriesPoint:
      type: object
      properties:
        day: { type: string, format: date }
        reviews: { type: integer }
        estUsd: { type: number }
    PaginationMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

  responses:
    ValidationError:
      description: Input failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: No/invalid session (or webhook signature failure on webhook routes)
    Forbidden: { description: In-tenant capability denial }
    NotFound: { description: Resource missing or cross-tenant (no existence oracle) }
    RateLimited: { description: "429 + Retry-After" }
    ErrorBody:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

paths:
  /auth/signup:
    post:
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Account created }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/signin:
    post:
      operationId: authSignin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        "200": { description: Session cookie set; returns user + orgs }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "ACCOUNT_LOCKED after 5 failures in 15m" }
  /auth/signout:
    post:
      operationId: authSignout
      responses: { "200": { description: Session revoked } }
  /auth/me:
    get:
      operationId: authMe
      responses: { "200": { description: Current user + their orgs + role per org } }
  /orgs:
    post:
      operationId: orgsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 2 } }
      responses:
        "201": { description: "Org created; the user is the owner" }
        "403": { description: EMAIL_UNVERIFIED gate }
  /orgs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: orgsGet
      responses:
        "200": { description: Org detail }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: orgsUpdate
      description: "admin+"
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: orgsDelete
      description: "owner only; soft-delete + grace window"
      responses:
        "202": { description: Deletion scheduled }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{id}/reviews:
    get:
      operationId: reviewsList
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReviewJobStatus" } }
        - { name: repoId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: "Paginated review jobs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReviewJob" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/reviews/{jobId}:
    get:
      operationId: reviewsGet
      responses:
        "200": { description: "Job detail: summary + cost + status" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/reviews/{jobId}/findings:
    get:
      operationId: reviewsFindings
      parameters:
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/FindingSeverity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/FindingCategory" } }
      responses:
        "200":
          description: "Findings for the job (post-policy, post-dedup)"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewFinding" }
  /orgs/{id}/findings/{findingId}/actions:
    post:
      operationId: findingsAction
      description: "developer+; records an action (feeds the north-star metric)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingAction" }
      responses:
        "200": { description: "Action recorded" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/security:
    get:
      operationId: securityRollup
      description: "Org-wide findings, severity >= high, time-filtered"
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "Security rollup" }
  /orgs/{id}/usage:
    get:
      operationId: usageRead
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [30d, 90d, 12mo] } }
      responses:
        "200":
          description: "Usage from the usage_daily rollup + quota state"
          content:
            application/json:
              schema:
                type: object
                properties:
                  series: { type: array, items: { $ref: "#/components/schemas/UsageSeriesPoint" } }
                  quota: { $ref: "#/components/schemas/Quota" }
  /orgs/{id}/github/review:
    post:
      operationId: githubReReview
      description: "developer+; re-review an open PR at a commit (US-105)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequestPayload" }
      responses:
        "202": { description: "Job enqueued (same-SHA is an idempotent no-op)" }
        "409": { description: "ALREADY_REVIEWED / QUOTA_EXCEEDED — the existing/skip state is in details" }
  /webhooks/github:
    post:
      operationId: githubWebhook
      security: []
      description: "Public; HMAC-verified; verify+enqueue only. Not in the cookie-auth surface."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "GitHub event body; validated per-event by the contracts schema"
      responses:
        "202": { description: "Verified + enqueued (or state transitioned)" }
        "401": { description: "WEBHOOK_REJECTED — bad signature / timestamp / replay; audited" }
        "422": { description: "WEBHOOK_MALFORMED — verified but schema-invalid; not enqueued" }
        "404": { description: "Verified but the install is unknown to us" }
  /webhooks/billing:
    post:
      operationId: billingWebhook
      security: []
      description: "Public; provider-signature verified; idempotent on event id."
      responses:
        "200": { description: "Verified; plan state moved (or idempotent no-op)" }
        "401": { description: "BILLING_REJECTED — signature failure; audited" }
```

## Notes

- **Two public routes** (`/webhooks/*`) have `security: []` — they're authorized by signature, not cookie. The OpenAPI keeps them in the doc for completeness; the actual authz is the HMAC/provider-signature layer.
- **The `contracts` package is the source of truth.** This YAML is a *projection* of the Zod schemas (the same types). CI regenerates it; a hand-edit to the YAML that diverges from `contracts` is reverted by the codegen gate.
- **`ReviewRequestPayload` and `ReviewFinding` match `packages/contracts/src/index.ts` exactly** (id/file/line/severity/category/title/description/suggestedFix/confidence/promptVersion) — the existing scaffold's schemas are the seed for `contracts`'s final form.
