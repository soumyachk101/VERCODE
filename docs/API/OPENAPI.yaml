# VERCODE — OpenAPI Specification

This is the *documented* OpenAPI 3.1 skeleton matching `API_SPECIFICATION.md` + `contracts`. **This file is hand-maintained** — there is no CI codegen step and no machine-generated `openapi.gen.yaml` copy; keep it in sync with the Fastify routes by review.

```yaml
openapi: 3.1.0
info:
  title: VERCODE API
  version: 1.0.0
  description: Dashboard + webhook API for the VERCODE AI code-review SaaS.
servers:
  - url: https://api.vercode.example/v1

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vercode_session

  schemas:
    FindingSeverity: { type: string, enum: [low, medium, high, critical] }
    FindingCategory:
      type: string
      enum: [logic-bug, security, performance, race-condition, resource-leak,
             api-contract, db-consistency, edge-case, assumption]
    ReviewFinding:
      type: object
      required: [id, file, line, severity, category, title, description, confidence]
      properties:
        id: { type: string }
        file: { type: string }
        line: { type: integer, minimum: 0 }
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        category: { $ref: "#/components/schemas/FindingCategory" }
        title: { type: string, minLength: 1 }
        description: { type: string }
        suggestedFix: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        promptVersion: { type: string }
    ReviewSummary:
      type: object
      required: [verdict, highSeverityCount, topRisks, overallConfidence]
      properties:
        verdict: { type: string }
        highSeverityCount: { type: integer, minimum: 0 }
        topRisks: { type: array, items: { type: string } }
        overallConfidence: { type: number, minimum: 0, maximum: 1 }
    ReviewJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, skipped, partial]
    ReviewJob:
      type: object
      required: [id, orgId, repoId, prNumber, commitSha, status, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        repoId: { type: string }
        prNumber: { type: integer, minimum: 1 }
        commitSha: { type: string }
        status: { $ref: "#/components/schemas/ReviewJobStatus" }
        skipReason: { type: string }
        estUsdCost: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    ReviewRequestPayload:
      type: object
      required: [orgId, repoId, prNumber, commitSha]
      properties:
        orgId: { type: string, minLength: 1 }
        repoId: { type: string, minLength: 1 }
        prNumber: { type: integer, minimum: 1 }
        commitSha: { type: string, minLength: 4 }
        confidenceFloor: { type: number, minimum: 0, maximum: 1 }
    FindingAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accepted, dismissed_reasonable, dismissed_unreasonable, fixed, ignored]
    UsageSeriesPoint:
      type: object
      properties:
        day: { type: string, format: date }
        reviews: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        estUsdCost: { type: number }
        findingCounts: { type: object, additionalProperties: true }
    UsageTotals:
      type: object
      properties:
        reviews: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        estUsd: { type: number }
        bySeverity: { type: object, additionalProperties: { type: integer } }
    PaginationMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }

  responses:
    ValidationError:
      description: Input failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: No/invalid session (or webhook signature failure on webhook routes)
    Forbidden: { description: In-tenant capability denial }
    NotFound: { description: Resource missing or cross-tenant (no existence oracle) }
    RateLimited: { description: "429 + Retry-After" }
    ErrorBody:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

paths:
  /auth/signup:
    post:
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: Account created }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/signin:
    post:
      operationId: authSignin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        "200": { description: Session cookie set; returns user + orgs }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "ACCOUNT_LOCKED after 5 failures in 15m" }
  /auth/signout:
    post:
      operationId: authSignout
      responses: { "200": { description: Session revoked } }
  /auth/me:
    get:
      operationId: authMe
      responses: { "200": { description: Current user + their orgs + role per org } }
  /orgs:
    post:
      operationId: orgsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 2 } }
      responses:
        "201": { description: "Org created; the user is the owner" }
        "403": { description: EMAIL_UNVERIFIED gate }
  /orgs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: orgsGet
      responses:
        "200": { description: Org detail }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: orgsDelete
      description: "owner only; soft-delete + grace window"
      responses:
        "202": { description: Deletion scheduled }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{id}/reviews:
    get:
      operationId: reviewsList
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReviewJobStatus" } }
        - { name: repoId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: "Paginated review jobs"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReviewJob" } }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/reviews/{jobId}:
    get:
      operationId: reviewsGet
      responses:
        "200": { description: "Job detail: summary + cost + status" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/reviews/{jobId}/findings:
    get:
      operationId: reviewsFindings
      parameters:
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/FindingSeverity" } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/FindingCategory" } }
      responses:
        "200":
          description: "Findings for the job (post-policy, post-dedup)"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewFinding" }
  /orgs/{id}/findings/{findingId}/actions:
    post:
      operationId: findingsAction
      description: "developer+; records an action (feeds the north-star metric)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingAction" }
      responses:
        "200": { description: "Action recorded" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{id}/security:
    get:
      operationId: securityRollup
      description: "Org-wide findings, severity >= high, time-filtered"
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "Security rollup" }
  /auth/github/start:
    get:
      operationId: githubOauthStart
      parameters:
        - { name: redirect, in: query, schema: { type: string, format: uri } }
      responses:
        "200":
          description: "GitHub authorize URL + anti-CSRF state token"
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  state: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "GITHUB_OAUTH_NOT_CONFIGURED — no GITHUB_CLIENT_ID on this deploy" }
  /auth/github/callback:
    get:
      operationId: githubOauthCallback
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirects to /settings/account?github=connected (or ?github=error&reason=...) on denial/state-mismatch/exchange failure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/github/disconnect:
    post:
      operationId: githubOauthDisconnect
      responses:
        "200": { description: "The user's GitHub token + handle cleared" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /health/healthz:
    get:
      operationId: healthLiveness
      security: []
      responses:
        "200": { description: "Liveness: { ok, ts }" }
  /health/readyz:
    get:
      operationId: healthReadiness
      security: []
      responses:
        "200": { description: "Readiness: DB up ({ ok, db: up })" }
        "503": { description: "DB down ({ ok: false, db: down })" }
  /orgs/{id}/github/candidates:
    get:
      operationId: githubCandidates
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "The ACTIVE install's connectable repo rows + account metadata; { connected: false, candidates: [] } when no ACTIVE install exists"
  /orgs/{id}/github/connect:
    post:
      operationId: githubConnect
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
      responses:
        "200": { description: "Bare: intent audit line + install URL. Pinned repo: the row re-enabled. 404 NOT_FOUND when the row is unknown; 422 when already connected" }
  /orgs/{id}/github/repositories:
    get:
      operationId: githubRepositories
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "All known repos, including disabled rows (the settings page's accessible-repos list)" }
  /orgs/{id}/github-repos:
    put:
      operationId: githubActiveRepos
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repoIds: { type: array, items: { type: string } }
      responses:
        "200": { description: "Active-for-review set stored on org_settings; stale/foreign ids are dropped; { ok, activeRepoIds }" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{id}/usage:
    get:
      operationId: usageRead
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [30d, 90d, 12mo] } }
      responses:
        "200":
          description: "Usage from the usage_daily rollup + the current month's usage_events totals (plain reporting — no quota/limit)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  series: { type: array, items: { $ref: "#/components/schemas/UsageSeriesPoint" } }
                  totals: { $ref: "#/components/schemas/UsageTotals" }
  /orgs/{id}/github/review:
    post:
      operationId: githubReReview
      description: "developer+; re-review an open PR at a commit (US-105)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequestPayload" }
      responses:
        "202": { description: "Job enqueued (same-SHA is an idempotent no-op)" }
        "409": { description: "An in-flight identical job (same commit SHA) already exists — the existing job id is returned, no new work" }
  /webhooks/github:
    post:
      operationId: githubWebhook
      security: []
      description: "Public; HMAC-verified; verify+enqueue only. Not in the cookie-auth surface."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "GitHub event body; validated per-event by the contracts schema"
      responses:
        "202": { description: "Verified + enqueued (or state transitioned)" }
        "401": { description: "WEBHOOK_REJECTED — bad signature / timestamp / replay; audited" }
        "422": { description: "WEBHOOK_MALFORMED — verified but schema-invalid; not enqueued" }
        "404": { description: "WEBHOOK_UNKNOWN_INSTALL — verified but the install is unknown to us; audited" }
```

## Notes

- **The one public route** (`/webhooks/github`) has `security: []` — it's authorized by HMAC, not cookie.
- **This YAML is hand-maintained.** There is no codegen gate; keep it in sync with the Fastify routes (`apps/api/src/routes/`) by review.
- **`ReviewRequestPayload` and `ReviewFinding` match `packages/contracts/src/index.ts` exactly** (id/file/line/severity/category/title/description/suggestedFix/confidence/promptVersion).
