<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="VERCODE system architecture diagram" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#0f172a"/>

  <!-- GitHub external -->
  <rect x="40" y="60" width="180" height="84" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">GitHub App</text>
  <text x="130" y="112" text-anchor="middle" fill="#cbd5e1" font-size="11">Webhooks (HMAC-SHA256)</text>
  <text x="130" y="128" text-anchor="middle" fill="#cbd5e1" font-size="11">PR diffs · reviews · checks</text>

  <!-- api -->
  <rect x="320" y="60" width="200" height="84" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="92" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="700">apps/api — Fastify</text>
  <text x="420" y="112" text-anchor="middle" fill="#cbd5e1" font-size="11">auth · webhooks · dashboard REST</text>
  <text x="420" y="128" text-anchor="middle" fill="#cbd5e1" font-size="11">billing events · enqueue jobs</text>

  <!-- web -->
  <rect x="40" y="220" width="180" height="84" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="252" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">apps/web — Next.js</text>
  <text x="130" y="272" text-anchor="middle" fill="#cbd5e1" font-size="11">Dashboard UI</text>
  <text x="130" y="288" text-anchor="middle" fill="#cbd5e1" font-size="11">React 19 · Tailwind 4</text>

  <!-- redis -->
  <rect x="320" y="220" width="200" height="84" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="252" text-anchor="middle" fill="#6ee7b7" font-size="15" font-weight="700">Redis</text>
  <text x="420" y="272" text-anchor="middle" fill="#cbd5e1" font-size="11">BullMQ queues · sessions · cache</text>
  <text x="420" y="288" text-anchor="middle" fill="#cbd5e1" font-size="11">jobs: review, retention</text>

  <!-- worker -->
  <rect x="320" y="420" width="200" height="84" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="420" y="452" text-anchor="middle" fill="#f9a8d4" font-size="15" font-weight="700">apps/worker</text>
  <text x="420" y="472" text-anchor="middle" fill="#cbd5e1" font-size="11">BullMQ consumer</text>
  <text x="420" y="488" text-anchor="middle" fill="#cbd5e1" font-size="11">pipeline orchestrator</text>

  <!-- packages group -->
  <rect x="560" y="400" width="400" height="190" rx="12" fill="#0b1120" stroke="#475569" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="760" y="424" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">packages/*</text>
  <text x="760" y="446" text-anchor="middle" fill="#cbd5e1" font-size="11">diff-engine · static-analysis · ai-providers</text>
  <text x="760" y="462" text-anchor="middle" fill="#cbd5e1" font-size="11">github · database · contracts (Zod schemas)</text>
  <text x="760" y="478" text-anchor="middle" fill="#cbd5e1" font-size="11">billing · observability · config</text>
  <rect x="580" y="496" width="360" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="760" y="514" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">AI providers (OpenAI · Anthropic · Ollama)</text>
  <text x="760" y="530" text-anchor="middle" fill="#cbd5e1" font-size="11">model routing · cost tracking · token budgets</text>

  <!-- postgres -->
  <rect x="40" y="420" width="180" height="84" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="130" y="452" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">PostgreSQL 16</text>
  <text x="130" y="472" text-anchor="middle" fill="#cbd5e1" font-size="11">Prisma ORM · JSONB findings</text>
  <text x="130" y="488" text-anchor="middle" fill="#cbd5e1" font-size="11">org-scoped rows · audit log</text>

  <!-- billing external -->
  <rect x="700" y="60" width="260" height="84" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="830" y="92" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Stripe / Razorpay</text>
  <text x="830" y="112" text-anchor="middle" fill="#cbd5e1" font-size="11">webhook signature verification</text>
  <text x="830" y="128" text-anchor="middle" fill="#cbd5e1" font-size="11">plan + quota state machine</text>

  <!-- observability external -->
  <rect x="40" y="560" width="400" height="56" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="584" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Sentry · OpenTelemetry · pino</text>
  <text x="240" y="602" text-anchor="middle" fill="#cbd5e1" font-size="11">correlation id end-to-end · secret redaction</text>

  <!-- edges -->
  <line x1="220" y1="102" x2="316" y2="102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="94" text-anchor="middle" fill="#94a3b8" font-size="10">signed events</text>

  <line x1="420" y1="144" x2="420" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="186" fill="#94a3b8" font-size="10">enqueue (review-queue)</text>

  <line x1="130" y1="220" x2="130" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 130 160 L 316 160" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="150" y="186" fill="#94a3b8" font-size="10">REST + session cookie</text>

  <line x1="520" y1="262" x2="606" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 606 300 L 520 300 L 520 416" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="288" fill="#94a3b8" font-size="10">dequeue job</text>

  <line x1="320" y1="462" x2="224" y2="462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="454" text-anchor="middle" fill="#94a3b8" font-size="10">findings · usage</text>

  <line x1="520" y1="486" x2="556" y2="486" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="538" y="478" text-anchor="middle" fill="#94a3b8" font-size="10">calls</text>

  <line x1="420" y1="60" x2="700" y2="60" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 760 60 L 760 40 L 520 40" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="620" y="32" text-anchor="middle" fill="#94a3b8" font-size="10">billing webhooks</text>

  <path d="M 420 504 L 420 560 L 440 560" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <text x="450" y="554" fill="#94a3b8" font-size="10">metrics · traces · logs</text>

  <!-- legend -->
  <text x="40" y="40" fill="#f1f5f9" font-size="16" font-weight="700">VERCODE — System Architecture</text>
  <text x="40" y="56" fill="#64748b" font-size="11">modular monolith: 3 deployables + managed state · shared Zod contracts</text>
</svg>
