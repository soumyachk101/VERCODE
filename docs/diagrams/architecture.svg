<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" role="img" aria-label="VERCODE system architecture" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t-main { font-size: 18px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .t-sub  { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .h-card { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .b-card { font-size: 10.5px; fill: #475569; }
      .pill   { font-size: 9.5px; font-weight: 700; }
    </style>
    <marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="dShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.02"/>
    </filter>
  </defs>

  <rect width="1020" height="540" fill="#f8fafc"/>
  
  <text x="40" y="38" class="t-main">VERCODE — System Architecture</text>
  <text x="40" y="56" class="t-sub">Three stateless deployable units · Redis BullMQ queue buffer · PostgreSQL durable state</text>

  <!-- External Column -->
  <g filter="url(#dShadow)">
    <rect x="40" y="80" width="220" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="40" y="80" width="220" height="3" rx="1.5" fill="#ef4444"/>
    <rect x="56" y="94" width="130" height="22" rx="4" fill="#fee2e2"/>
    <text x="121" y="109" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="800">EXTERNAL INGRESS</text>

    <rect x="56" y="130" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="70" y="152" class="h-card">GitHub Webhooks</text>
    <text x="70" y="170" class="b-card">PR opened / sync / review</text>
    <text x="70" y="184" class="b-card">HMAC-SHA256 signed</text>

    <rect x="56" y="210" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="70" y="232" class="h-card">Developer Browser</text>
    <text x="70" y="250" class="b-card">Next.js 15 Dashboard UI</text>
    <text x="70" y="264" class="b-card">Session cookie auth</text>

    <rect x="56" y="290" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="70" y="312" class="h-card">Billing Webhooks</text>
    <text x="70" y="330" class="b-card">Stripe / Razorpay events</text>
    <text x="70" y="344" class="b-card">Idempotent plan updates</text>

    <rect x="56" y="370" width="188" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="70" y="392" class="h-card" fill="#991b1b">Zero-Trust Input</text>
    <text x="70" y="412" class="b-card">• Repo diffs are data only</text>
    <text x="70" y="430" class="b-card">• No tool execution access</text>
    <text x="70" y="448" class="b-card">• Schema re-validation</text>
    <text x="70" y="466" class="b-card">• Secret masking gate</text>
  </g>

  <!-- Platform Core Column -->
  <g filter="url(#dShadow)">
    <rect x="300" y="80" width="420" height="420" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <rect x="300" y="80" width="420" height="3" rx="1.5" fill="#2563eb"/>
    <rect x="316" y="94" width="150" height="22" rx="4" fill="#dbeafe"/>
    <text x="391" y="109" text-anchor="middle" fill="#1e40af" font-size="10.5" font-weight="800">PLATFORM CORE</text>

    <rect x="316" y="130" width="388" height="90" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
    <text x="330" y="152" class="h-card" fill="#1d4ed8">apps/api (Fastify 5 Server)</text>
    <text x="330" y="172" class="b-card">• Webhook receiver: verify + dedup &lt; 300 ms (202 Accepted)</text>
    <text x="330" y="190" class="b-card">• Dashboard REST API + RBAC capability guards</text>
    <text x="330" y="208" class="b-card" font-weight="700" fill="#b91c1c">• NEVER calls LLM or fetches diff on ingress path (T-10)</text>

    <rect x="316" y="234" width="388" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="330" y="254" class="h-card" fill="#c2410c">BullMQ review-queue (Redis 7)</text>
    <text x="330" y="272" class="b-card">Carries { jobId } pointer only · concurrency: 4 workers per node</text>

    <rect x="316" y="302" width="388" height="180" rx="8" fill="#f8fafc" stroke="#fed7aa" stroke-width="1"/>
    <text x="330" y="324" class="h-card" fill="#c2410c">apps/worker (BullMQ Review Consumer)</text>
    <text x="330" y="344" class="b-card">1. Pre-flight quota check &amp; same-SHA idempotency</text>
    <text x="330" y="362" class="b-card">2. Bounded diff fetch (max 60 files / 3,000 lines)</text>
    <text x="330" y="380" class="b-card">3. Deterministic static analysis (ESLint + Semgrep AST)</text>
    <text x="330" y="398" class="b-card">4. Task-routed schema-validated AI review pass</text>
    <text x="330" y="416" class="b-card">5. Anchor check → dedup (file,line,cat) → 0.6 confidence floor</text>
    <text x="330" y="434" class="b-card">6. Persist-then-Publish: write Postgres before GitHub call</text>
    <text x="330" y="454" class="b-card" font-weight="700" fill="#0f766e">✓ Wall-clock budget: 240 s timeout with partial results</text>
  </g>

  <!-- External Integrations & Storage Column -->
  <g filter="url(#dShadow)">
    <rect x="760" y="80" width="220" height="420" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <rect x="760" y="80" width="220" height="3" rx="1.5" fill="#10b981"/>
    <rect x="776" y="94" width="160" height="22" rx="4" fill="#dcfce7"/>
    <text x="856" y="109" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="800">SERVICES &amp; DATA</text>

    <rect x="776" y="130" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="790" y="152" class="h-card">PostgreSQL 16</text>
    <text x="790" y="170" class="b-card">Tenant org_id leading</text>
    <text x="790" y="184" class="b-card">Immutable audit_events</text>

    <rect x="776" y="206" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="790" y="228" class="h-card">GitHub Platform</text>
    <text x="790" y="246" class="b-card">Octokit App JWT auth</text>
    <text x="790" y="260" class="b-card">Inline reviews + verdict</text>

    <rect x="776" y="282" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="790" y="304" class="h-card">AI Gateways</text>
    <text x="790" y="322" class="b-card">OpenAI · Anthropic · Ollama</text>
    <text x="790" y="336" class="b-card">Zero-retention headers</text>

    <rect x="776" y="358" width="188" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="790" y="380" class="h-card">Cloud KMS</text>
    <text x="790" y="398" class="b-card">App key KMS-wrapped</text>
    <text x="790" y="412" class="b-card">AES-256-GCM BYOK</text>

    <rect x="776" y="434" width="188" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="790" y="454" class="h-card">Observability</text>
    <text x="790" y="470" class="b-card">Pino redact · OpenTelemetry</text>
  </g>

  <!-- Connectors -->
  <line x1="244" y1="162" x2="294" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#darr)"/>
  <line x1="510" y1="220" x2="510" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#darr)"/>
  <line x1="510" y1="288" x2="510" y2="298" stroke="#64748b" stroke-width="1.5" marker-end="url(#darr)"/>
  <line x1="704" y1="380" x2="754" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#darr)"/>
</svg>
