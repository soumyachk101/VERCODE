<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="VERCODE review pipeline data flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="dfArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="dfArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="dfArrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1040" height="430" fill="#0f172a"/>
  <text x="40" y="38" fill="#f8fafc" font-size="17" font-weight="800" letter-spacing="-0.3px">VERCODE — Review Pipeline Data Flow</text>
  <text x="40" y="56" fill="#94a3b8" font-size="11.5">HMAC-verified event → BullMQ dispatch → deterministic static + task-routed AI → dedup &amp; policy → PR comments</text>

  <!-- Row 1: Ingress, Queue, Context, Static, AI -->
  <!-- 1. PR Webhook Event -->
  <rect x="40" y="90" width="160" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="115" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">1. PR Webhook Event</text>
  <text x="120" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10.5">POST /webhooks/github</text>
  <text x="120" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">HMAC-SHA256 · 5m window</text>

  <!-- 2. Job Queue (BullMQ) -->
  <rect x="240" y="90" width="160" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="320" y="115" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">2. Job Dispatch</text>
  <text x="320" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10.5">BullMQ review-queue</text>
  <text x="320" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">In-flight lock · Quota gate</text>

  <!-- 3. Context Retrieval -->
  <rect x="440" y="90" width="160" height="74" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="520" y="115" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">3. Context Retrieval</text>
  <text x="520" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Diff + 1-hop AST imports</text>
  <text x="520" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">Max 60 files / 3k lines</text>

  <!-- 4. Static Analysis -->
  <rect x="640" y="90" width="160" height="74" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="720" y="115" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="700">4. Static Analysis</text>
  <text x="720" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10.5">ESLint + Semgrep AST</text>
  <text x="720" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">Deterministic (0 token cost)</text>

  <!-- 5. AI Reasoning -->
  <rect x="840" y="90" width="160" height="74" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="920" y="115" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="700">5. Task-Routed AI</text>
  <text x="920" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10.5">OpenAI · Anthropic · Ollama</text>
  <text x="920" y="148" text-anchor="middle" fill="#94a3b8" font-size="9.5">Zod schema re-validated</text>

  <!-- Row 2: Merge, Policy, Persist, Publish (Flows right to left) -->
  <!-- 6. Findings Merge & Dedup -->
  <rect x="740" y="230" width="170" height="74" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="825" y="255" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">6. Merge &amp; Validate</text>
  <text x="825" y="272" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Line-in-diff anchor check</text>
  <text x="825" y="288" text-anchor="middle" fill="#94a3b8" font-size="9.5">Dedup on (file, line, cat)</text>

  <!-- 7. Policy Engine -->
  <rect x="500" y="230" width="170" height="74" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="585" y="255" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">7. Policy Engine</text>
  <text x="585" y="272" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Confidence floor (≥ 0.6)</text>
  <text x="585" y="288" text-anchor="middle" fill="#94a3b8" font-size="9.5">Repo custom suppression</text>

  <!-- 8. Persist-then-Publish (Postgres) -->
  <rect x="260" y="230" width="170" height="74" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="345" y="255" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">8. Persist Transaction</text>
  <text x="345" y="272" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Atomic DB Transaction</text>
  <text x="345" y="288" text-anchor="middle" fill="#94a3b8" font-size="9.5">Findings + status + usage</text>

  <!-- 9. GitHub PR Publication -->
  <rect x="40" y="230" width="160" height="74" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="120" y="255" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">9. GitHub Publication</text>
  <text x="120" y="272" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Summary + inline comments</text>
  <text x="120" y="288" text-anchor="middle" fill="#94a3b8" font-size="9.5">Fallback to PR body if needed</text>


  <!-- ========================================================================= -->
  <!-- CONNECTORS & ARROWS                                                       -->
  <!-- ========================================================================= -->

  <!-- 1 -> 2 -->
  <line x1="200" y1="127" x2="231" y2="127" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#dfArrow)"/>

  <!-- 2 -> 3 -->
  <line x1="400" y1="127" x2="431" y2="127" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#dfArrow)"/>

  <!-- 3 -> 4 -->
  <line x1="600" y1="127" x2="631" y2="127" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#dfArrow)"/>

  <!-- 4 -> 5 -->
  <line x1="800" y1="127" x2="831" y2="127" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#dfArrow)"/>

  <!-- Row 1 to Row 2: Static (4) -> Merge (6) -->
  <path d="M 720,164 V 197 H 800 V 221" fill="none" stroke="#f472b6" stroke-width="1.8" marker-end="url(#dfArrow)"/>

  <!-- Row 1 to Row 2: AI (5) -> Merge (6) -->
  <path d="M 920,164 V 197 H 850 V 221" fill="none" stroke="#c084fc" stroke-width="1.8" marker-end="url(#dfArrowPurple)"/>

  <!-- 6 -> 7 -->
  <line x1="740" y1="267" x2="679" y2="267" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#dfArrowAmber)"/>

  <!-- 7 -> 8 -->
  <line x1="500" y1="267" x2="439" y2="267" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#dfArrowPurple)"/>

  <!-- 8 -> 9 -->
  <line x1="260" y1="267" x2="209" y2="267" stroke="#34d399" stroke-width="1.8" marker-end="url(#dfArrowGreen)"/>


  <!-- Bottom Invariants Legend -->
  <rect x="40" y="345" width="960" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="367" fill="#fbbf24" font-size="11" font-weight="700">CORE PIPELINE INVARIANTS:</text>
  <text x="220" y="367" fill="#cbd5e1" font-size="10.5">1. Pre-flight quota check ensures 0 AI tokens spent when over budget</text>
  <text x="60" y="385" fill="#cbd5e1" font-size="10.5">2. Same commit SHA no-ops  ·  3. Line-exists validation eliminates hallucinated line numbers  ·  4. Independent publish retries on GitHub 429</text>
</svg>
