<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" role="img" aria-label="VERCODE review data flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .df-title { font-size: 18px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .df-sub   { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .st-num   { font-size: 11px; font-weight: 800; fill: #1e40af; }
      .st-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .st-desc  { font-size: 10px; fill: #475569; }
      .badge    { font-size: 9px; font-weight: 700; }
    </style>
    <marker id="dfarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="dfShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.02"/>
    </filter>
  </defs>

  <rect width="1020" height="540" fill="#f8fafc"/>
  
  <text x="40" y="38" class="df-title">VERCODE — Review Data Flow &amp; Lifecycle</text>
  <text x="40" y="56" class="df-sub">Constant-latency webhook ingest · Bounded diff retrieval · Deterministic-first dual analysis · Persist-then-publish</text>

  <!-- Step 1: Webhook Ingest -->
  <g filter="url(#dfShadow)">
    <rect x="40" y="80" width="280" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="40" y="80" width="280" height="3" rx="1.5" fill="#ef4444"/>
    <text x="56" y="104" class="st-num">1. WEBHOOK INGRESS</text>
    <text x="56" y="122" class="st-title">Verify &amp; Enqueue (&lt; 300ms)</text>
    <text x="56" y="140" class="st-desc">• HMAC-SHA256 signature + 5-min timestamp window</text>
    <text x="56" y="156" class="st-desc">• 24h delivery dedup · Enqueue review-queue</text>
    <text x="56" y="170" class="st-desc" font-weight="700" fill="#dc2626">• Returns 202 Accepted; zero LLM hot path</text>
  </g>

  <!-- Step 2: Job Dispatch -->
  <g filter="url(#dfShadow)">
    <rect x="370" y="80" width="280" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="370" y="80" width="280" height="3" rx="1.5" fill="#ea580c"/>
    <text x="386" y="104" class="st-num" fill="#c2410c">2. JOB DISPATCH &amp; GATES</text>
    <text x="386" y="122" class="st-title">BullMQ Worker Dequeue</text>
    <text x="386" y="140" class="st-desc">• Worker dequeues { jobId } pointer from Redis</text>
    <text x="386" y="156" class="st-desc">• Re-reads durable state from PostgreSQL</text>
    <text x="386" y="170" class="st-desc" font-weight="700" fill="#ea580c">• Same-SHA check &amp; quota pre-flight gates</text>
  </g>

  <!-- Step 3: Context Retrieval -->
  <g filter="url(#dfShadow)">
    <rect x="700" y="80" width="280" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="700" y="80" width="280" height="3" rx="1.5" fill="#2563eb"/>
    <text x="716" y="104" class="st-num" fill="#1d4ed8">3. CONTEXT RETRIEVAL</text>
    <text x="716" y="122" class="st-title">Bounded Diff &amp; AST</text>
    <text x="716" y="140" class="st-desc">• Octokit fetches raw PR diff via App token</text>
    <text x="716" y="156" class="st-desc">• 1-hop AST imports (capped: 60 files / 3k lines)</text>
    <text x="716" y="170" class="st-desc" font-weight="700" fill="#2563eb">• Cached in Redis with 24h TTL</text>
  </g>

  <!-- Step 4: Deterministic Analysis -->
  <g filter="url(#dfShadow)">
    <rect x="40" y="230" width="280" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="40" y="230" width="280" height="3" rx="1.5" fill="#10b981"/>
    <text x="56" y="254" class="st-num" fill="#15803d">4. STATIC ANALYSIS (RULES)</text>
    <text x="56" y="272" class="st-title">Deterministic AST Scan</text>
    <text x="56" y="292" class="st-desc">• ESLint + Semgrep runner subprocesses</text>
    <text x="56" y="308" class="st-desc">• 100% reproducible; zero AI token cost</text>
    <text x="56" y="324" class="st-desc">• Authoritative findings; exempt from floor</text>
    <text x="56" y="340" class="st-desc" font-weight="700" fill="#15803d">• Detects syntax, security &amp; logic bugs</text>
  </g>

  <!-- Step 5: Task-Routed AI -->
  <g filter="url(#dfShadow)">
    <rect x="370" y="230" width="280" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="370" y="230" width="280" height="3" rx="1.5" fill="#8b5cf6"/>
    <text x="386" y="254" class="st-num" fill="#6d28d9">5. TASK-ROUTED AI</text>
    <text x="386" y="272" class="st-title">Schema-Validated Reasoning</text>
    <text x="386" y="292" class="st-desc">• Triage pass → deep review high-risk</text>
    <text x="386" y="308" class="st-desc">• Dedicated security review pass</text>
    <text x="386" y="324" class="st-desc">• Outputs validated against contracts Zod</text>
    <text x="386" y="340" class="st-desc" font-weight="700" fill="#6d28d9">• Models: OpenAI GPT-4o / Claude / Ollama</text>
  </g>

  <!-- Step 6: Policy & Dedup -->
  <g filter="url(#dfShadow)">
    <rect x="700" y="230" width="280" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="700" y="230" width="280" height="3" rx="1.5" fill="#6366f1"/>
    <text x="716" y="254" class="st-num" fill="#4338ca">6. POLICY &amp; DEDUP</text>
    <text x="716" y="272" class="st-title">Anchor Check &amp; Filtering</text>
    <text x="716" y="292" class="st-desc">• Match finding lines against unified diff</text>
    <text x="716" y="308" class="st-desc">• 3-Tuple dedup: (file, line, category)</text>
    <text x="716" y="324" class="st-desc">• Filter below confidence floor (0.6 default)</text>
    <text x="716" y="340" class="st-desc" font-weight="700" fill="#4338ca">• Apply per-repository suppressions</text>
  </g>

  <!-- Step 7: Persist & Publish -->
  <g filter="url(#dfShadow)">
    <rect x="40" y="396" width="450" height="114" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="40" y="396" width="450" height="3" rx="1.5" fill="#0d9488"/>
    <text x="56" y="420" class="st-num" fill="#0f766e">7. PERSIST-THEN-PUBLISH</text>
    <text x="56" y="438" class="st-title">Transactional PostgreSQL Write &amp; GitHub Publication</text>
    <text x="56" y="458" class="st-desc">• Insert review_findings, update review_jobs, record audit_events</text>
    <text x="56" y="474" class="st-desc">• Post validated inline comments + summary verdict to GitHub PR</text>
    <text x="56" y="490" class="st-desc" font-weight="700" fill="#0f766e">• Fallback to PR-body comment if line anchor fails verification</text>
  </g>

  <!-- Step 8: Resilience -->
  <g filter="url(#dfShadow)">
    <rect x="530" y="396" width="450" height="114" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="530" y="396" width="450" height="3" rx="1.5" fill="#059669"/>
    <text x="546" y="420" class="st-num" fill="#15803d">8. RESILIENCE &amp; QUOTA AUDIT</text>
    <text x="546" y="438" class="st-title">Wall-Clock Budget &amp; Token Attribution</text>
    <text x="546" y="458" class="st-desc">• Wall-clock timeout (240s) yields partial results instead of hanging</text>
    <text x="546" y="474" class="st-desc">• Rate-limit 403/429 backs off exponentially through retry queue</text>
    <text x="546" y="490" class="st-desc" font-weight="700" fill="#15803d">• Attribution of token spend and prompt version to tenant org</text>
  </g>

  <!-- Flow Arrows -->
  <line x1="320" y1="128" x2="362" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <line x1="650" y1="128" x2="692" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <path d="M 840,176 V 204 H 180 V 222" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <line x1="320" y1="290" x2="362" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <line x1="650" y1="290" x2="692" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <path d="M 840,350 V 374 H 265 V 388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
  <line x1="490" y1="453" x2="522" y2="453" stroke="#64748b" stroke-width="1.5" marker-end="url(#dfarr)"/>
</svg>
