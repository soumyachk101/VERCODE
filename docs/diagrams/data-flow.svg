<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="VERCODE review pipeline data flow" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#0f172a"/>
  <text x="40" y="40" fill="#f1f5f9" font-size="16" font-weight="700">VERCODE — Review Pipeline (worker data flow)</text>
  <text x="40" y="56" fill="#64748b" font-size="11">HMAC-verified event → enqueue → static + AI analysis → dedup/policy → validated PR comments</text>

  <!-- row 1: event to queue -->
  <rect x="40" y="90" width="150" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115" y="115" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">PR Event</text>
  <text x="115" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">webhook (HMAC +</text>
  <text x="115" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">replay protection)</text>

  <rect x="230" y="90" width="150" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="305" y="115" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">Job Queue</text>
  <text x="305" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">BullMQ / Redis</text>
  <text x="305" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">queued → running</text>

  <rect x="420" y="90" width="150" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="495" y="115" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">Context Retrieval</text>
  <text x="495" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">diff files · 1-hop imports</text>
  <text x="495" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">bounded token budget</text>

  <rect x="610" y="90" width="150" height="70" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text x="685" y="115" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="700">Static Analysis</text>
  <text x="685" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">deterministic rules</text>
  <text x="685" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">(zero LLM cost)</text>

  <rect x="800" y="90" width="160" height="70" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="880" y="115" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="700">AI Review</text>
  <text x="880" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">LLM with schema-validated</text>
  <text x="880" y="146" text-anchor="middle" fill="#cbd5e1" font-size="10">structured output</text>

  <!-- row 2: merge, policy, publish -->
  <rect x="420" y="220" width="150" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="495" y="245" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">Findings</text>
  <text x="495" y="262" text-anchor="middle" fill="#cbd5e1" font-size="10">merged + deduped</text>
  <text x="495" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10">severity · confidence</text>

  <rect x="230" y="220" width="150" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="305" y="245" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">Policy Engine</text>
  <text x="305" y="262" text-anchor="middle" fill="#cbd5e1" font-size="10">confidence floor · plan quota</text>
  <text x="305" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10">org rules · skip notice</text>

  <rect x="40" y="220" width="150" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="115" y="245" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">PR Comments</text>
  <text x="115" y="262" text-anchor="middle" fill="#cbd5e1" font-size="10">inline anchors +</text>
  <text x="115" y="276" text-anchor="middle" fill="#cbd5e1" font-size="10">summary verdict</text>

  <rect x="40" y="330" width="150" height="56" rx="8" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="115" y="352" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Postgres + webhook</text>
  <text x="115" y="368" text-anchor="middle" fill="#64748b" font-size="10">audit · usage · cost</text>

  <!-- edges -->
  <line x1="190" y1="125" x2="226" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>
  <line x1="380" y1="125" x2="416" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>
  <line x1="570" y1="125" x2="606" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>
  <line x1="760" y1="125" x2="796" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>

  <path d="M 880 160 L 880 200 L 576 200 L 576 240" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <line x1="670" y1="140" x2="560" y2="140" stroke="#94a3b8" stroke-width="0" />
  <path d="M 685 160 L 685 195 L 495 195 L 495 216" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#farrow)"/>
  <line x1="416" y1="255" x2="384" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>
  <line x1="226" y1="255" x2="194" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>
  <line x1="115" y1="290" x2="115" y2="326" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#farrow)"/>

  <!-- legend -->
  <text x="610" y="330" fill="#64748b" font-size="11">Key invariants: AI outputs are schema-validated before use ·</text>
  <text x="610" y="346" fill="#64748b" font-size="11">repo content is treated as data, never instructions ·</text>
  <text x="610" y="362" fill="#64748b" font-size="11">a skipped review posts a notice, never fails silently</text>
</svg>
