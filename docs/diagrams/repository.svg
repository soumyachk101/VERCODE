<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 580" width="1020" height="580" role="img" aria-label="VERCODE monorepo structure" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .repo-title { font-size: 18px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .repo-sub   { font-size: 11.5px; font-weight: 500; fill: #64748b; }
      .card-h     { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .card-d     { font-size: 10px; fill: #64748b; }
      .badge      { font-size: 9.5px; font-weight: 700; }
    </style>
    <marker id="tarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="rShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.02"/>
    </filter>
  </defs>

  <rect width="1020" height="580" fill="#f8fafc"/>
  
  <!-- Header -->
  <text x="40" y="38" class="repo-title">VERCODE — Monorepo Structure (pnpm workspaces)</text>
  <text x="40" y="56" class="repo-sub">TypeScript strict · Node 22 · shared contracts package as single source of truth</text>

  <!-- Root Workspace -->
  <g filter="url(#rShadow)">
    <rect x="380" y="80" width="260" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="380" y="80" width="260" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="510" y="105" text-anchor="middle" fill="#b45309" font-size="13" font-weight="700">vercode (pnpm workspace root)</text>
    <text x="510" y="124" text-anchor="middle" fill="#64748b" font-size="11">pnpm-workspace.yaml · ESLint 9 · Vitest 3</text>
  </g>

  <!-- Apps Column -->
  <g filter="url(#rShadow)">
    <rect x="50" y="196" width="310" height="264" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="50" y="196" width="310" height="3" rx="1.5" fill="#2563eb"/>
    <rect x="66" y="208" width="80" height="22" rx="4" fill="#dbeafe"/>
    <text x="106" y="223" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="800">APPS/</text>

    <rect x="66" y="240" width="278" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="260" class="card-h">apps/web</text>
    <text x="80" y="276" class="card-d">Next.js 15 App Router · React 19 · Dashboard UI</text>

    <rect x="66" y="298" width="278" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="318" class="card-h">apps/api</text>
    <text x="80" y="334" class="card-d">Fastify 5 · Webhooks · REST · RBAC Auth · Prisma</text>

    <rect x="66" y="356" width="278" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="376" class="card-h">apps/worker</text>
    <text x="80" y="392" class="card-d">BullMQ Consumer · 12-Stage Review Pipeline</text>
  </g>

  <!-- Packages Column -->
  <g filter="url(#rShadow)">
    <rect x="390" y="196" width="580" height="264" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="390" y="196" width="580" height="3" rx="1.5" fill="#8b5cf6"/>
    <rect x="406" y="208" width="110" height="22" rx="4" fill="#ede9fe"/>
    <text x="461" y="223" text-anchor="middle" fill="#6d28d9" font-size="11" font-weight="800">PACKAGES/</text>

    <!-- Row 1 -->
    <rect x="406" y="240" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="418" y="258" class="card-h" fill="#6d28d9">contracts</text>
    <text x="418" y="274" class="card-d">Zod schemas (SSOT)</text>

    <rect x="590" y="240" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="602" y="258" class="card-h">github</text>
    <text x="602" y="274" class="card-d">App auth · diff · publish</text>

    <rect x="774" y="240" width="180" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="786" y="258" class="card-h">database</text>
    <text x="786" y="274" class="card-d">Prisma · tenant repos</text>

    <!-- Row 2 -->
    <rect x="406" y="296" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="418" y="314" class="card-h">diff-engine</text>
    <text x="418" y="330" class="card-d">pure diff parser</text>

    <rect x="590" y="296" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="602" y="314" class="card-h">static-analysis</text>
    <text x="602" y="330" class="card-d">ESLint + Semgrep AST</text>

    <rect x="774" y="296" width="180" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="786" y="314" class="card-h">ai-providers</text>
    <text x="786" y="330" class="card-d">LLM adapters + routing</text>

    <!-- Row 3 -->
    <rect x="406" y="352" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="418" y="370" class="card-h">review-engine</text>
    <text x="418" y="386" class="card-d">pipeline orchestration</text>

    <rect x="590" y="352" width="170" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="602" y="370" class="card-h">policy-engine</text>
    <text x="602" y="386" class="card-d">floors · quotas · skip</text>

    <rect x="774" y="352" width="180" height="46" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="786" y="370" class="card-h">billing</text>
    <text x="786" y="386" class="card-d">plans · provider webhooks</text>

    <!-- Row 4 -->
    <rect x="406" y="408" width="170" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="418" y="425" class="card-h">observability</text>
    <text x="418" y="440" class="card-d">logs · traces · redact</text>

    <rect x="590" y="408" width="170" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="602" y="425" class="card-h">config</text>
    <text x="602" y="440" class="card-d">typed env · model routing</text>
  </g>

  <!-- Infra & Tests & Docs Row -->
  <g filter="url(#rShadow)">
    <rect x="50" y="482" width="210" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="155" y="504" text-anchor="middle" class="card-h">infra/ (Docker · Compose)</text>
    <text x="155" y="521" text-anchor="middle" class="card-d">Dev stack &amp; production manifests</text>

    <rect x="280" y="482" width="220" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="390" y="504" text-anchor="middle" class="card-h">tests/</text>
    <text x="390" y="521" text-anchor="middle" class="card-d">Unit · integration · e2e · security suites</text>

    <rect x="520" y="482" width="240" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="640" y="504" text-anchor="middle" class="card-h">docs/</text>
    <text x="640" y="521" text-anchor="middle" class="card-d">Product · technical · security · operations</text>
  </g>

  <!-- Lines -->
  <line x1="450" y1="140" x2="205" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#tarrow)"/>
  <line x1="570" y1="140" x2="680" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#tarrow)"/>
  <text x="290" y="165" fill="#64748b" font-size="10.5" font-weight="600">deployables</text>
  <text x="650" y="165" fill="#64748b" font-size="10.5" font-weight="600">shared packages</text>

  <!-- SSOT Callout -->
  <rect x="780" y="482" width="190" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="875" y="503" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">CORE ARCHITECTURE RULE</text>
  <text x="875" y="520" text-anchor="middle" fill="#475569" font-size="9.5">All packages import from contracts</text>
</svg>
